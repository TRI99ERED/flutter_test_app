name: test_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_svg: any
  google_fonts: any

  async: any
  collection: any
  meta: any
  go_router: any

  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  cloud_functions: ^6.0.2
  firebase_storage: ^13.1.0
  google_maps_flutter: ^2.14.2
  geolocator: ^14.0.2

  rxdart: ^0.27.7
  path_provider: ^2.1.5
  image_picker: ^1.2.1
  image_picker_for_web: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: AppIcons
      fonts:
        - asset: assets/fonts/AppIcons.ttf

android:
  minSdkVersion: 21
