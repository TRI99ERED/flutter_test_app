name: test_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_svg: 2.2.4
  google_fonts: 8.0.2

  async: 2.13.0
  collection: 1.19.1
  meta: 1.17.0
  go_router: 17.1.0

  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  cloud_functions: ^6.0.2
  firebase_storage: ^13.1.0
  google_maps_flutter: ^2.14.2
  geolocator: ^14.0.2

  rxdart: ^0.28.0
  path_provider: ^2.1.5
  file_picker: ^10.3.10
  google_sign_in: ^7.2.0
  flutter_keyboard_visibility: ^6.0.0
  shared_preferences: ^2.5.4
  google_sign_in_web: ^1.1.3
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: AppIcons
      fonts:
        - asset: assets/fonts/AppIcons.ttf

android:
  minSdkVersion: 21
